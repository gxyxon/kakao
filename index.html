<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 장소 검색 서비스</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: 'Malgun Gothic', sans-serif; }

        #container { display: flex; width: 100%; height: 100vh; }

        /* 왼쪽 사이드바 */
        #sidebar {
            width: 350px; height: 100%; padding: 20px;
            background: #ffffff; border-right: 1px solid #ddd;
            display: flex; flex-direction: column; z-index: 2;
        }

        /* 오른쪽 지도 */
        #map { flex: 1; height: 100%; z-index: 1; }

        .search-box { display: flex; gap: 5px; margin-bottom: 20px; }
        #keyword { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        #search-btn { padding: 10px 15px; background: #fee500; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        
        #results-list { list-style: none; overflow-y: auto; flex: 1; }
        .item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.2s; }
        .item:hover { background: #f9f9f9; }
        .item strong { color: #333; display: block; margin-bottom: 5px; }
        .item small { color: #888; }
    </style>
</head>
<body>

<div id="container">
    <aside id="sidebar">
        <div class="search-box">
            <input type="text" id="keyword" placeholder="예: 강남역 맛집" onkeypress="if(event.keyCode==13) searchPlaces()">
            <button id="search-btn" onclick="searchPlaces()">검색</button>
        </div>
        <ul id="results-list"></ul>
    </aside>
    <div id="map"></div>
</div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=778e014ba7e921c24f8abd37480e3c4f&libraries=services&autoload=false"></script>

<script>
    let map; 
    let ps;  
    let markers = []; 

    // 지도가 로드된 후 실행되도록 보장
    kakao.maps.load(function() {
        const mapContainer = document.getElementById('map');
        const mapOptions = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567), // 초기값: 서울시청
            level: 5
        };

        // 지도 생성
        map = new kakao.maps.Map(mapContainer, mapOptions);
        
        // 장소 검색 객체 생성
        ps = new kakao.maps.services.Places();

        // 현재 위치 권한 요청 및 지도 중심 이동
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const currentPos = new kakao.maps.LatLng(lat, lon);
                
                map.setCenter(currentPos);
                displayMarker(currentPos, "현재 내 위치");
            }, function(err) {
                console.warn("위치 권한 거부됨: 기본 위치를 사용합니다.");
            });
        }
    });

    function searchPlaces() {
        const keyword = document.getElementById('keyword').value;

        if (!keyword.trim()) {
            alert('검색어를 입력하세요!');
            return;
        }

        // 키워드로 장소검색을 요청합니다
        ps.keywordSearch(keyword, function(data, status) {
            if (status === kakao.maps.services.Status.OK) {
                displayResults(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 없습니다.');
            } else {
                alert('검색 중 오류가 발생했습니다.');
            }
        });
    }

    function displayResults(places) {
        const listEl = document.getElementById('results-list');
        const bounds = new kakao.maps.LatLngBounds();
        
        listEl.innerHTML = '';
        removeMarkers();

        for (let i = 0; i < places.length; i++) {
            const placePos = new kakao.maps.LatLng(places[i].y, places[i].x);
            displayMarker(placePos, places[i].place_name);
            bounds.extend(placePos);

            const itemEl = document.createElement('li');
            itemEl.className = 'item';
            itemEl.innerHTML = `<strong>${places[i].place_name}</strong><small>${places[i].address_name}</small>`;
            
            itemEl.onclick = function() {
                map.panTo(placePos);
            };
            
            listEl.appendChild(itemEl);
        }
        map.setBounds(bounds);
    }

    function displayMarker(position, title) {
        const marker = new kakao.maps.Marker({
            map: map,
            position: position
        });
        markers.push(marker);
        return marker;
    }

    function removeMarkers() {
        markers.forEach(m => m.setMap(null));
        markers = [];
    }
</script>
</body>
</html>
